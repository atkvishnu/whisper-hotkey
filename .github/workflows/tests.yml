name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make check
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Whisper and install into an isolated container
        run: docker build -f tests/Dockerfile.integration -t whisper-hotkey-integration .
      - name: Exercise real audio, inference, and clipboard
        run: docker run --rm whisper-hotkey-integration
